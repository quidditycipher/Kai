name: Build APK on Demand

on:
  workflow_dispatch:

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        run: chmod +x gradlew

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Build Tools
        run: |
          yes | sdkmanager "build-tools;36.0.0" || true
          yes | sdkmanager "build-tools;29.0.3" || true

      - name: Build APK
        run: bash ./gradlew :androidApp:assembleFossRelease --stacktrace --no-daemon

      - name: Show APK files
        if: always()
        run: |
          echo "=== Searching for APKs ==="
          find . -name "*.apk" 2>/dev/null || echo "No APKs found"
          echo "=== androidApp build dir ==="
          ls -la androidApp/build/outputs/apk/ 2>/dev/null || echo "No apk dir"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kai-custom-apk
          path: "**/*.apk"
